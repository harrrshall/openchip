[project]
name = "openchip"
version = "0.1.0"
description = "Autonomous hardware-development agent: natural-language request -> RTL project with reproducible verification evidence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
openchip = "openchip.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openchip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cloud: requires the JarvisLabs instance (EDA tools and model endpoint)"]

[tool.ruff]
line-length = 100
target-version = "py310"
