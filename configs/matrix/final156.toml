# Final benchmark on the CPU VM: selected harness on all 156 VerilogEval v2 spec-to-rtl problems, two repeats, two gateway models.
#   cd ~/openchip-matrix && .venv/bin/openchip matrix run --spec configs/matrix/final156.toml
out_root = "/home/ubuntu/openchip-runs/final156"
repeats = 2
budget = "6m"
concurrency = 8
harnesses = ["no-review"]

[dataset]
path = "/home/ubuntu/verilog-eval/dataset_spec-to-rtl"
every_nth = 1

[[models]]
name = "deepseek-v4-flash"
provider = "openrouter"
base_url = "https://agentrouter.org/v1"
model = "deepseek-v4-flash"
api_key_env = "AGENTROUTER_API_KEY"
user_agent = "claude-cli/2.1.0 (external, cli)"
max_concurrency = 4
[models.extra_body]
reasoning_effort = "low"

[[models]]
name = "glm-5.3"
provider = "openrouter"
base_url = "https://agentrouter.org/v1"
model = "glm-5.3"
api_key_env = "AGENTROUTER_API_KEY"
user_agent = "claude-cli/2.1.0 (external, cli)"
max_concurrency = 4
[models.extra_body]
reasoning_effort = "low"
