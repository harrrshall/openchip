# Selection matrix v1 on the CPU VM: gateway models only (no GPU). Run from ~/openchip-matrix on the VM.
#   .venv/bin/openchip matrix run --spec configs/matrix/vm-gateway.toml
out_root = "/home/ubuntu/openchip-runs/matrix"
repeats = 2
budget = "6m"
concurrency = 8
harnesses = ["baseline", "no-review", "alt-ref", "direct"]

[dataset]
path = "/home/ubuntu/verilog-eval/dataset_spec-to-rtl"
every_nth = 4

[[models]]
name = "deepseek-v4-flash"
provider = "openrouter"
base_url = "https://agentrouter.org/v1"
model = "deepseek-v4-flash"
api_key_env = "AGENTROUTER_API_KEY"
user_agent = "claude-cli/2.1.0 (external, cli)"
max_concurrency = 4
[models.extra_body]
reasoning_effort = "low"

[[models]]
name = "glm-5.3"
provider = "openrouter"
base_url = "https://agentrouter.org/v1"
model = "glm-5.3"
api_key_env = "AGENTROUTER_API_KEY"
user_agent = "claude-cli/2.1.0 (external, cli)"
max_concurrency = 4
[models.extra_body]
reasoning_effort = "low"

# Cross-family second reference for `alt-ref` (meaningful for the deepseek primary; same family for glm).
[alt_model]
provider = "openrouter"
base_url = "https://agentrouter.org/v1"
model = "glm-5.3"
api_key_env = "AGENTROUTER_API_KEY"
user_agent = "claude-cli/2.1.0 (external, cli)"
extra_body = { reasoning_effort = "low" }
