# Stage 1b on OpenCode Go: the three models served only through the Responses API, 39-problem subset, one repeat, review off.
out_root = "/home/ubuntu/openchip-runs/go-stage1b"
repeats = 1
budget = "6m"
concurrency = 3
harnesses = ["no-review"]

[dataset]
path = "/home/ubuntu/verilog-eval/dataset_spec-to-rtl"
every_nth = 4

[[models]]
name = "muse-spark-1.3-contributor"
provider = "openai-responses"
base_url = "https://opencode.ai/zen/go/v1"
model = "muse-spark-1.3-contributor"
api_key_env = "OPENCODE_GO_API_KEY"
max_concurrency = 1
[models.extra_body]
reasoning_effort = "low"

[[models]]
name = "gpt-5.6-luna"
provider = "openai-responses"
base_url = "https://opencode.ai/zen/go/v1"
model = "gpt-5.6-luna"
api_key_env = "OPENCODE_GO_API_KEY"
max_concurrency = 1
[models.extra_body]
reasoning_effort = "low"

[[models]]
name = "grok-4.6"
provider = "openai-responses"
base_url = "https://opencode.ai/zen/go/v1"
model = "grok-4.6"
api_key_env = "OPENCODE_GO_API_KEY"
max_concurrency = 1
[models.extra_body]
reasoning_effort = "low"
