# Stage 1 on OpenCode Go: every model that answers through chat completions, on the 39-problem subset, one repeat,
# review off. Ranks the field cheaply; the top models then get the full 156 x 2 (final156-go-top.toml).
# The Go endpoint needs a stable x-opencode-session header; OPENCHIP_EXTRA_HEADERS carries it (set by the run script).
#   cd ~/openchip-matrix && .venv/bin/openchip matrix run --spec configs/matrix/go-stage1.toml
out_root = "/home/ubuntu/openchip-runs/go-stage1"
repeats = 1
budget = "6m"
concurrency = 3
harnesses = ["no-review"]

[dataset]
path = "/home/ubuntu/verilog-eval/dataset_spec-to-rtl"
every_nth = 4

[[models]]
name = "kimi-k3"
provider = "openrouter"
base_url = "https://opencode.ai/zen/go/v1"
model = "kimi-k3"
api_key_env = "OPENCODE_GO_API_KEY"
max_concurrency = 1

