# Second self-hosted model on the fixed harness: Qwen3.5-35B-A3B served by vLLM on its H200, all 156 problems x 2, review off.
out_root = "/home/ubuntu/openchip-runs/final156-qwen35"
repeats = 2
budget = "6m"
concurrency = 8
harnesses = ["no-review"]

[dataset]
path = "/home/ubuntu/verilog-eval/dataset_spec-to-rtl"
every_nth = 1

[[models]]
name = "qwen3.5-35b-a3b"
provider = "openai-compatible"
base_url_env = "OPENCHIP_MODEL_BASE_URL"
model = "Qwen/Qwen3.5-35B-A3B"
api_key_env = "OPENCHIP_MODEL_API_KEY"
max_concurrency = 8
[models.overlay.model]
thinking_roles = ["intake"]
