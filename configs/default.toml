# OpenChip validated defaults. Override with ./openchip.toml, $OPENCHIP_CONFIG, or env vars.
# No credentials here. The model API key is read from $OPENCHIP_MODEL_API_KEY.

[model]
provider = "openai-compatible"
base_url = "http://127.0.0.1:8000/v1"
# Default selected by measurement on 2026-09-09 (docs/decisions/0006-model-selection.md); alternatives in configs/models/.
model = "openai/gpt-oss-120b"
revision = "b5c939de8f754692c1647ca79fbf85e8c1e70f8a"
max_tokens = 10000
temperature = 0.2
top_p = 0.95
seed = 1234
context_window = 32768
timeout_s = 600.0
thinking = false            # gpt-oss always reasons at the depth set by reasoning_effort (extra_body below)
thinking_roles = []
thinking_budget = 12000

[model.extra_body]
reasoning_effort = "low"

[tools]
iverilog = "iverilog"
vvp = "vvp"
verilator = "verilator"
yosys = "yosys"
sby = "sby"
timeout_s = 300.0

[budget]
wall_time_s = 3600.0
max_repair_iterations = 4
max_model_calls = 40
max_total_tokens = 2000000

[verification]
sim_cycles = 400
seeds = [1, 2, 3]
require_lint = true
require_synth = true
corroborate = true       # acceptance requires agreement with a second independently derived reference (or 2 of 3)
run_formal = true        # SBY bounded model checking on the model-written property checker (extra evidence)
require_formal = false   # optional formal may time out; a counterexample still withholds sign-off
review_counterexamples = false  # experimental independent checker review, explicitly opt in
formal_depth = 20
formal_timeout_s = 300.0
